name: mobile

# Сборка Android-приложения. Запускается, только когда в mobile/ появится Gradle-проект.
on:
  push:
    branches: [main, develop]
    paths: ["mobile/**", ".github/workflows/mobile.yml"]
  pull_request:
    paths: ["mobile/**", ".github/workflows/mobile.yml"]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Skip if Android project not created yet
        if: ${{ hashFiles('mobile/gradlew') == '' }}
        run: echo "В mobile/ пока нет Gradle-проекта — сборка пропущена"
      - if: ${{ hashFiles('mobile/gradlew') != '' }}
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - if: ${{ hashFiles('mobile/gradlew') != '' }}
        uses: gradle/actions/setup-gradle@v4
      - if: ${{ hashFiles('mobile/gradlew') != '' }}
        working-directory: mobile
        run: chmod +x gradlew && ./gradlew assembleDebug
